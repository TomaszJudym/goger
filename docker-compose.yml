version: '3'
services:
  postgres:
    image: postgres:latest
    container_name: pg
    deploy:
      resources:
        limits:
          cpus: '3'
    environment:
      PGUSER: goger
      POSTGRES_DB: goger
      POSTGRES_USER: goger
      POSTGRES_PASSWORD: goger
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
# Custom config
#      - ./postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "goger"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 2s 

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 2s

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fetcher
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-network

  updater:
    build:
      context: .
      dockerfile: Dockerfile-update
    container_name: updater
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-network

  fronter:
    build:
      context: .
      dockerfile: Dockerfile-front
    container_name: fronter
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - db-network
      - redis-network

networks:
  db-network:
    driver: bridge
  redis-network:
    driver: bridge



