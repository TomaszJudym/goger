version: '3'
services:
  postgres:
    image: postgres:latest
    container_name: pg
    deploy:
      resources:
        limits:
          cpus: '3'
    environment:
      PGUSER: goger
      POSTGRES_DB: goger
      POSTGRES_USER: goger
      POSTGRES_PASSWORD: goger
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
# Custom config
#      - ./postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - goger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "goger"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 2s 

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fetcher
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - goger-network

  fronter:
    build:
      context: .
      dockerfile: Dockerfile-front
    container_name: fronter
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - goger-network

networks:
  goger-network:
    driver: bridge
