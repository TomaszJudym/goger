<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', monospace;
            background: #050505;
            color: #96dced;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #171717;
            color: #96dced;
        }

        th, td {
            padding: 0.5rem;
            border: 1px solid #333333;
        }

        thead {
            background: #272727;
        }

        tbody tr:nth-child(even) {
            background: #2f2f2f;
        }

        a {
            color: #96dced;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .pagination a {
            margin: 0 5px;
            padding: 5px 10px;
            background: #272727;
            color: #96dced;
        }

        .pagination a:hover {
            background: #2f2f2f;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Reviews</title>
</head>
<script>
    // Function to store the page number in localStorage
    function rememberPageNumber(pageNumber) {
        var urlParams = new URLSearchParams(window.location.search); // Get the URL query parameters
            var pageNumber = urlParams.get('page'); // Extract the value of the 'page' parameter
            if (pageNumber) {
                localStorage.setItem('gamesPageNumber', pageNumber);
            }
    }
</script>
<body>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Reviews Count</th>
                </tr>
            </thead>
            <tbody>
                {{range .Games}}
                <tr>
                    <td><a href="/games/{{.ID}}/reviews" onclick="rememberPageNumber()">{{.ID}}</a></td>
                    <td>{{.Title}}</td>
                    <td>{{.ReviewsCount}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="pagination">
            {{range $i := seq .TotalPages}}
                <a href="?page={{$i}}">{{$i}}</a>
            {{end}}
        </div>
    </div>
</body>
</html>
