<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Game Reviews</title>
</head>
<body>
    <div class="container">
        <h1>Game Reviews</h1>
        <table class="cyberpunk-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Reviews Count</th>
                </tr>
            </thead>
            <tbody>
                {{range .Games}}
                <tr>
                    <td><a href="/games/{{.ID}}/reviews">{{.ID}}</a></td>
                    <td>{{.Title}}</td>
                    <td>{{.ReviewsCount}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="pagination">
            {{range $i := seq .TotalPages}}
                <a href="?page={{$i}}">{{$i}}</a>
            {{end}}
        </div>
    </div>
</body>
</html>
