<style>
    html, body {
        margin: 0;
        padding: 0;
        font-family: 'Space Mono', monospace;
        background: #050505;
        color: #a074d4;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #171717;
        color: #a074d4;
    }

    th, td {
        padding: 0.25rem;
        border: 1px solid #333333;
    }

    thead {
        background: #272727;
    }

    tbody tr:nth-child(even) {
        background: #2f2f2f;
    }

    td:nth-child(2) {
        min-width: 300px;
    }

    td:nth-child(3) {
        width: 100px;
    }

    td:nth-child(4) {
        width: 150px;
    }

    td:nth-child(5) {
        width: 100px;
    }

    td:nth-child(6) {
        width: 100px;
    }

    td:nth-child(7) {
        width: 100px;
    }

    td:nth-child(8) {
        width: 100px;
    }

    td:nth-child(9) {
        width: 100px;
    }

    td:nth-child(10) {
        width: 100px;
    }

    a {
        color: #a074d4;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .pagination {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
    }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games</title>
</head>
<body>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Reviews Count</th>
                    <th>Common Langs</th>
                    <th>Lang 1</th>
                    <th>Lang 2</th>
                    <th>Lang 3</th>
                    <th>Lang 4</th>
                    <th>Lang 5</th>
                </tr>
            </thead>
            <tbody>
                {{range .Games}}
                <tr>
                    <td><a href="/games/{{.ID}}/reviews">{{.ID}}</a></td>
                    <td>{{.Title}}</td>
                    <td>{{.ReviewsCount}}</td>
                    <td>{{.CommonLangs}}</td>
                    <td>{{.Lang1}}</td>
                    <td>{{.Lang2}}</td>
                    <td>{{.Lang3}}</td>
                    <td>{{.Lang4}}</td>
                    <td>{{.Lang5}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="pagination">
            {{range $i := seq .TotalPages}}
                <a href="?page={{$i}}">{{$i}}</a>
            {{end}}
        </div>
    </div>
</body>
</html>
