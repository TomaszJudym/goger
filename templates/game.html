<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #2e2e2e;
      color: #ffffff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 20px;
      padding: 20px;
    }

    .grid-item {
      border: 1px solid #ccc;
      padding: 20px;
      text-align: center;
      background-color: #444;
      color: #fff;

      display: grid;
      place-items: center;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      padding: 16px;
    }

    .image-grid img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 9999;
      background-color: rgba(0, 0, 0, 0.8);
    }

    .fullscreen-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>{{.Title}}</h1>
    <div class="grid-container">
      {{range .Items}}
      <div class="grid-item">
        {{index . 0}}: {{index . 1}}
      </div>
      {{end}}
      <div class="grid-item">
        <p>Top languages in comments</p>
        {{range $index, $item := .Languages}}
        {{if $index}}, {{end}}{{.Language}}: {{.ReviewCount}}
        {{end}}
      </div>
    </div>
    <div class="image-grid">
      {{range .Screenshots}}
      <img src="{{.}}" alt="screenshot" class="clickable-image">
      {{end}}
    </div>
  </div>
  <div id="fullscreenContainer" class="fullscreen-container">
    <img id="fullscreenImage" class="fullscreen" />
  </div>
</body>

<script>
  const images = document.querySelectorAll('.clickable-image');
  const fullscreenImage = document.getElementById('fullscreenImage');
  const fullscreenContainer = document.getElementById('fullscreenContainer');

  // For each image, add a click event to open it in fullscreen
  images.forEach(image => {
    image.addEventListener('click', () => {
      fullscreenImage.src = image.src;
      fullscreenContainer.style.display = 'flex';
    });
  });

  // Close the fullscreen mode when the background is clicked
  fullscreenContainer.addEventListener('click', () => {
    fullscreenContainer.style.display = 'none';
  });
</script>

</html>
