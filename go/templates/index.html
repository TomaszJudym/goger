<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Game Reviews</title>
</head>
<body>
    <div class="container">
        <h1>Game Reviews</h1>
        <table class="cyberpunk-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Reviews Count</th>
                </tr>
            </thead>
            <tbody>
                {{range .Games}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Title}}</td>
                    <td>{{.ReviewsCount}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
        <div class="pagination">
            <a href="?page=1">1</a>
            <a href="?page=2">2</a>
        </div>
    </div>
</body>
</html>
