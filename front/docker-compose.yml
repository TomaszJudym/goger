version: '3.8'

services:
  fronter:
    build: .
    container_name: fronter
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fronter
    networks:
      - app_network

networks:
  app_network:
    driver: bridge 